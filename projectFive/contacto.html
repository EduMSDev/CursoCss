<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria SASS</title>
    <link rel="stylesheet" href="build/css/app.css">
</head>

<body>
    <header class="header header-contacto">
        <div class="contenido-header contenedor">
            <div class="barra">
                <div class="logo">
                    <img src="build/img/logo.svg" alt="" srcset="">
                </div>
                <nav class="nav-principal">
                    <a href="index.html">Inicio</a>
                    <a href="nosotros.html">Nosotros</a>
                    <a href="proceso.html">Proceso</a>
                    <a href="menu.html">Menu</a>
                    <a href="galeria.html">Galeria</a>
                    <a class="activo" href="contacto.html">Contacto</a>
                </nav>
            </div>
            <div class="texto-header">
                <h1>Mejores granos, mejor cafe</h1>
            </div>
        </div>
    </header>

    <main class="contenedor contenido-principal">
        <h2><span>Reserva tu</span>Mesa</h2>
        <div class="contenido-contacto">
            <form class="form" action="">
                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="tu nombre">
                </div>
                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="tu email">
                </div>
                <div class="campo">
                    <label for="nombre">Numero de persones:</label>
                    <select name="" id="">
                        <option disabled selected value="seleccione">Seleccione</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="mas">Más</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="hora">hora:</label>
                    <input type="time" id="hora" placeholder="tu email">
                </div>
                <div class="campo">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" placeholder="tu email">
                </div>
                <div class="campo">
                    <input type="submit" value="Enviar">
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="contenedor contenido-footer">
            <div class="footer-box ubicacion">
                <h3>Ubicacion</h3>
                <p>Calle inventada</p>
                <p>Ciudad inventada</p>
            </div>
            <div class="footer-box reserva">
                <h3>Reserva</h3>
                <p>637837263</p>
                <a href="tel:+637837263">Llamar</a>
            </div>
            <div class="footer-box horario">
                <h3>Horario</h3>
                <p>Lunes-Jue:11:00-22:00</p>
                <p>Vie-Sab:09:00-22:00</p>
                <p>Domingo - cerrado</p>
            </div>
        </div>
        <p class="copyright">Todos los derechos reservados - La cafeteria</p>
    </footer>

</body>

</html>
